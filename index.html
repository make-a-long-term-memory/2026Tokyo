.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
a{color:inherit}
h1,h2,h3,p{margin:0}

.top{background:transparent;text-shadow:0 1px 8px rgba(0,0,0,.55);color:var(--on-ink);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:28px max(16px,env(safe-area-inset-left,0px)) 24px}
.top-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.08em;opacity:.75}
h1{font-size:23px;line-height:1.3;font-weight:900;text-wrap:balance}
.range{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.range b{font:600 28px/1 var(--f-mono)}
.range span{opacity:.8;font-size:14px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid color-mix(in srgb,var(--on-ink) 35%,transparent)}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:transparent;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid transparent;transition:background .2s,border-color .2s}
nav.stuck{background:rgba(10,14,28,.72);border-bottom-color:var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
nav ul{list-style:none;margin:0 auto;padding:0;max-width:560px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav li{flex:1 0 auto}
nav a{display:block;text-align:center;text-decoration:none;font-size:13px;font-weight:700;padding:7px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
nav a i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c,var(--muted))}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:16px;font-weight:700}
.label{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-size:18px;font-weight:700;line-height:1.4}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;background:var(--fg);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--d2);outline-offset:2px}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:8px;padding:10px 12px;font-size:13px}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks li{padding-left:22px;position:relative}
.checks li::before{content:"";position:absolute;left:0;top:.45em;width:12px;height:12px;border:2px solid var(--muted);border-radius:3px}

.day{--c:var(--d1);display:flex;flex-direction:column;gap:14px;scroll-margin-top:64px}
.day-h{display:flex;align-items:center;gap:12px;padding:4px 2px;background:none;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.day-h .dn{font:600 30px/1 var(--f-mono);color:var(--c)}
.day-h .dt{display:flex;flex-direction:column;min-width:0}
.day-h .dt b{font-size:17px;line-height:1.3}
.day-h .dt span{font-size:12.5px;opacity:.9}
.route{margin-left:auto;font:600 12px/1 var(--f-mono);padding:5px 8px;border-radius:6px;background:rgba(0,0,0,.22);white-space:nowrap}

.line{list-style:none;margin:0;padding:0 0 0 0;position:relative;display:flex;flex-direction:column}
.line::before{content:"";position:absolute;left:66px;top:10px;bottom:10px;width:4px;border-radius:2px;background:var(--c)}
.stop{display:grid;grid-template-columns:52px 20px 1fr;column-gap:6px;padding:7px 0;align-items:start}
.time{font:500 13px/1.7 var(--f-mono);color:var(--muted);text-align:right}
.dot{position:relative;z-index:1;width:16px;height:16px;margin:5px 0 0 2px;border-radius:50%;background:var(--bg);border:4px solid var(--c)}
.stop.key .dot{background:var(--c)}
.body{min-width:0;display:flex;flex-direction:column;gap:3px}
.body b{font-weight:700;font-weight:500}
.stop.key .body .t{font-weight:700}
.sub{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--fg);margin-right:6px;vertical-align:1px}
.maps{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.maps a{font-size:12.5px;font-weight:500;text-decoration:none;padding:3px 10px;border-radius:99px;border:1px solid var(--c);color:var(--fg)}
.maps a::before{content:"📍 ";font-size:11px}

.foot{display:grid;grid-template-columns:1fr;gap:8px;font-size:13.5px;border-top:1px dashed var(--line);padding-top:12px}
.foot div{display:grid;grid-template-columns:44px 1fr;gap:8px}
.foot dt{color:var(--muted);font-weight:700}

.tel{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tel:first-of-type{border-top:0}
.tel small{display:block;color:var(--muted);font-size:12px}
.tel a{font:600 15px var(--f-mono);text-decoration:none;white-space:nowrap}
.copy{font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:6px 10px;min-height:36px}
small.end{color:var(--muted);text-align:center;font-size:12px}
.mapcard{padding:12px;gap:10px}
.mapcard #mapbox{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px}
.chip{flex:1 1 0;min-width:0;min-height:38px;padding:0 6px;border-radius:99px;border:1.5px solid var(--c);background:transparent;color:var(--fg);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c);color:#0b1020}
.chip:focus-visible,.pl:focus-visible,.zb:focus-visible{outline:3px solid var(--d2);outline-offset:2px}
.mapwrap{position:relative;border-radius:10px;overflow:hidden}
svg.map{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none}
svg.map .pt{cursor:pointer;outline:none}
svg.map .pt:focus-visible rect:first-of-type{stroke:var(--d2);stroke-width:2}
svg.map .pt text{font:700 8px var(--f-body);fill:#0b1020;text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg.map .lb{pointer-events:none}
svg.map .lb text{font:600 8.5px var(--f-body);fill:#cfd6ee;paint-order:stroke;stroke:#1b2548;stroke-width:2.4px;stroke-linejoin:round}
svg.map .lb.bold text{font-weight:800;fill:#fff}
svg.map .lb.lm text{fill:#ffe1a0}
.sub.meal{color:#ffd9a0}
svg.map .pt text.tgt{font:700 6.6px var(--f-body);fill:#0a0e1c}
svg.map image.bg{filter:invert(1) hue-rotate(180deg) brightness(1.15) contrast(.95) saturate(.6);opacity:.52}

/* 이름, 위도, 경도, 글자 dx, dy, 정렬, 확대 시에만(1), 굵게(1), 점(1), 명소(lm) */
var LBL=[
 ['도쿄역',35.6812,139.7671,6,3,'start',0,1,1,''],

 ['긴자',35.6717,139.7640,5,3,'start',1,0,1,''],
 ['롯폰기 힐스',35.6605,139.7292,-6,3,'end',1,0,1,'lm'],
 ['하라주쿠',35.6702,139.7027,-6,3,'end',1,0,1,''],
 ['도쿄 돔',35.7056,139.7519,-6,3,'end',1,0,1,'lm'],
 ['레인보우 브리지',35.6364,139.7630,-6,3,'end',1,0,1,'lm'],

];
var MEAL={h:'조식 · 호텔식 (2~4일차). 1일차 석식은 선샤인 시티 일대 자유식',a1:'중식 · 현지식 (햄버거 콤보)',b2:'중식 · 도시락 (학교 제공)',b3:'석식 · 자유식 (엔화 2,000엔)',c1:'중식 · 자유식 (엔화 2,000엔). 석식은 야키니쿠 (식당은 미정)'};

var MSEL='h',MF=0,V={z:1,cx:MW/2,cy:MH/2},ZMAX=5;
PTS.forEach(function(p){p.x=mx(p.lng)+(p.dx||0);p.y=my(p.lat)+(p.dy||0)});
function pById(id){for(var i=0;i<PTS.length;i++){if(PTS[i].id===id)return PTS[i]}}
function f1(n){return Math.round(n*10)/10}
function mapLink(p){return p.link||(MAP+encodeURIComponent(p.q))}
function bldg(body,win){
 return '<rect x="-5.5" y="-8" width="11" height="16" rx="1.5" fill="'+body+'" stroke="#0a0e1c" stroke-width="1"/>'
  +'<rect x="-3.3" y="-5.5" width="2" height="2" fill="'+win+'"/><rect x="1.3" y="-5.5" width="2" height="2" fill="'+win+'"/>'
  +'<rect x="-3.3" y="-1.5" width="2" height="2" fill="'+win+'"/><rect x="1.3" y="-1.5" width="2" height="2" fill="'+win+'"/>'
  +'<rect x="-1.5" y="3.5" width="3" height="4.5" fill="'+win+'"/>';
}
var ROUTES={1:['a1','a2','h'],2:['h','b1','b2','b3','h'],3:['h','c1','c2'],4:['h','d1']};
function arrowSVG(x0,y0,x1,y1,d,dim){
 var ang=Math.atan2(y1-y0,x1-x0)*180/Math.PI;
 return '<g opacity="'+(dim?.15:.95)+'" style="stroke:'+DC[d]+';fill:'+DC[d]+'"><line x1="'+f1(x0)+'" y1="'+f1(y0)+'" x2="'+f1(x1)+'" y2="'+f1(y1)+'" stroke-width="2.6" stroke-dasharray="0.1 6" stroke-linecap="round" vector-effect="non-scaling-stroke"/><g class="ar" data-x="'+f1(x1)+'" data-y="'+f1(y1)+'"><g transform="rotate('+f1(ang)+')"><path d="M-5,-4.5L1,0L-5,4.5" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g>';
}
function routesSVG(){
 var s='';
 [1,2,3,4].forEach(function(d){
  var ids=ROUTES[d],dim=MF&&MF!==d;
  for(var i=0;i<ids.length-1;i++){
   var A=pById(ids[i]),B=pById(ids[i+1]),dx=B.x-A.x,dy=B.y-A.y;
   if(Math.hypot(dx,dy)<44)continue;
   s+=arrowSVG(A.x+dx*.33,A.y+dy*.33,A.x+dx*.67,A.y+dy*.67,d,dim);
  }
 });
 var n=pById('d1');
 s+=arrowSVG(n.x+16,n.y-6,n.x+32,n.y-15,4,MF&&MF!==4);
 return s;
}
function mapSVG(){
 var s='<svg class="map" viewBox="0 0 '+MW+' '+MH+'" role="img" aria-label="도쿄 주요 장소 약식 지도">';
 s+='<rect width="'+MW+'" height="'+MH+'" fill="#1b2548"/><image class="bg" href="'+BGURI+'" x="'+OX+'" y="'+OY+'" width="'+MWI+'" height="'+f1(IH*KY)+'" preserveAspectRatio="none"/>';
 s+=routesSVG();
 s+='<text x="'+(MW-4)+'" y="40" font-size="9.5" font-weight="700" text-anchor="end" opacity="'+(MF&&MF!==4?.25:1)+'" style="fill:'+DC[4]+'">나리타 공항 → <tspan font-size="8" font-weight="400">(동쪽 약 60km)</tspan></text>';
 LBL.forEach(function(t){
  s+='<g class="lb'+(t[7]?' bold':'')+(t[9]?' '+t[9]:'')+'" data-x="'+f1(mx(t[2]))+'" data-y="'+f1(my(t[1]))+'"'+(t[6]?' data-minor="1"':'')+'>';
  if(t[8]){
   if(t[9]==='lm')s+='<circle r="2.2" fill="none" stroke="#ffe1a0" stroke-width="1.2"/>';
   else s+='<circle r="'+(t[7]?3:2)+'" fill="'+(t[7]?'#fff':'rgba(255,255,255,.6)')+'"/>';
  }
  s+='<text x="'+t[3]+'" y="'+t[4]+'" text-anchor="'+t[5]+'">'+t[0]+'</text></g>';
 });
 var order=PTS.filter(function(p){return p.id!==MSEL}).concat([pById(MSEL)]);
 order.forEach(function(p){
  var dim=MF&&p.day!==0&&p.day!==MF,sel=p.id===MSEL;
  s+='<g class="pt" data-id="'+p.id+'" data-x="'+f1(p.x)+'" data-y="'+f1(p.y)+'" tabindex="0" role="button" aria-label="'+esc((p.n?p.n+' ':'')+p.name)+'" opacity="'+(dim?.3:1)+'"><circle r="13" fill="transparent"/>';
  if(p.day===0){
   if(sel)s+='<rect x="-9" y="-11.5" width="18" height="23" rx="6" fill="none" stroke="#fff" stroke-width="1.5"/>';
   s+=bldg('#fff','#0a0e1c');
  }else{
   if(sel)s+='<rect x="-14" y="-9.5" width="28" height="19" rx="9.5" fill="none" stroke="#fff" stroke-width="1.5"/>';
   s+='<rect x="-10.5" y="-6.25" width="21" height="12.5" rx="6.25" style="fill:'+DC[p.day]+'" stroke="#0a0e1c" stroke-width="1"/><text y="0.5">'+p.n+'</text>';
   if(p.nm){var nl=p.nm[0].split('|');nl.forEach(function(t,i){var yy=p.nm[2]<0?p.nm[2]-(nl.length-1-i)*9.5:p.nm[2]+i*9.5;s+='<text class="nm" x="'+p.nm[1]+'" y="'+yy+'" style="text-anchor:'+p.nm[3]+'">'+t+'</text>'})}
  }
  if(TAG[p.id]){var tg=TGO[p.id],tw=TAG[p.id].length>2?33:17;s+='<rect x="'+tg[0]+'" y="'+tg[1]+'" width="'+tw+'" height="9.5" rx="4.75" style="fill:'+DC[p.day]+'" stroke="#0a0e1c" stroke-width=".8"/><text class="tgt" x="'+(tg[0]+tw/2)+'" y="'+(tg[1]+5.1)+'">'+TAG[p.id]+'</text>'}
  s+='</g>';
 });
 return s+'</svg>';
}
function applyView(){
 var svg=document.querySelector('#mapbox svg.map');if(!svg)return;
 var w=MW/V.z,h=MH/V.z;
 V.cx=Math.min(MW-w/2,Math.max(w/2,V.cx));V.cy=Math.min(MH-h/2,Math.max(h/2,V.cy));
 svg.setAttribute('viewBox',f1(V.cx-w/2)+' '+f1(V.cy-h/2)+' '+f1(w)+' '+f1(h));
 var k=Math.round(100/Math.pow(V.z,0.65))/100;
 svg.querySelectorAll('[data-x]').forEach(function(g){
  g.setAttribute('transform','translate('+g.getAttribute('data-x')+' '+g.getAttribute('data-y')+') scale('+k+')');
  if(g.hasAttribute('data-minor'))g.style.display=V.z>=2?'':'none';
 });
 svg.style.touchAction=V.z>1.01?'none':'pan-y';
 var z=document.querySelector('#mapbox .zb[data-z="in"]'),o=document.querySelector('#mapbox .zb[data-z="out"]');
 if(z)z.disabled=V.z>=ZMAX-0.01;if(o)o.disabled=V.z<=1.01;
}
function zoomBy(f,fx,fy){
 var nz=Math.min(ZMAX,Math.max(1,V.z*f));if(fx==null){fx=V.cx;fy=V.cy}
 V.cx=fx-(fx-V.cx)*V.z/nz;V.cy=fy-(fy-V.cy)*V.z/nz;V.z=nz;applyView();
}
function renderMap(){
 var p=pById(MSEL),h2='';
 h2+='<div class="chips" role="group" aria-label="일차 선택">';
 [[0,'전체'],[1,'1일차'],[2,'2일차'],[3,'3일차'],[4,'4일차']].forEach(function(c){
  h2+='<button type="button" class="chip" data-f="'+c[0]+'" aria-pressed="'+(MF===c[0])+'" style="--c:'+(c[0]?DC[c[0]]:'#fff')+'">'+c[1]+'</button>';
 });
 h2+='</div><div class="mapwrap">'+mapSVG()+'<div class="zoomctl"><button type="button" class="zb" data-z="in" aria-label="확대">+</button><button type="button" class="zb" data-z="out" aria-label="축소">−</button><button type="button" class="zb wide" data-z="reset">처음</button></div><span class="mapcredit">지도 © Google</span></div>';
 h2+='<p class="sub mapnote">번호 1-2는 1일차 두 번째 일정이고, 점선 화살표는 이동 방향이에요. 흰 건물 모양은 숙소, 노란 글씨는 근처의 유명 명소, 런치·디너 표시는 식사 장소입니다. 배경은 Google 지도 화면을 희미하게 깐 것이고, 점 위치는 대략입니다(스기나미소고 고등학교는 주소 기준 추정). 확대 버튼이나 두 손가락으로 크게 볼 수 있습니다.</p>';
 h2+='<div class="callout" style="--c:'+DC[p.day]+'"><span class="meta">'+(p.day?p.n+' · ':'')+DL[p.day]+' · '+esc(p.time)+'</span><span class="tt">'+esc(p.name)+'</span><span class="sub">'+esc(p.desc)+'</span>'+(MEAL[p.id]?'<span class="sub meal">식사: '+esc(MEAL[p.id])+'</span>':'')+'<a class="btn" href="'+mapLink(p)+'" target="_blank" rel="noopener">구글 지도에서 열기</a></div>';
 function row(q){
  var b=q.day===0?'<svg viewBox="-7 -9 14 18" width="12" height="15" aria-hidden="true" style="vertical-align:middle">'+bldg('#0a0e1c','#fff')+'</svg>':q.n;
  return '<li><button type="button" class="pl'+(q.id===MSEL?' on':'')+'" data-id="'+q.id+'" style="--c:'+DC[q.day]+'"><span class="badge">'+b+'</span><span class="pb"><b>'+esc(q.name)+'</b><span class="sub">'+esc(q.time)+' · '+esc(q.desc)+'</span>'+(MEAL[q.id]?'<span class="sub meal">식사: '+esc(MEAL[q.id])+'</span>':'')+'</span></button></li>';
 }
 h2+='<ul class="plist">'+row(pById('h'));
 [1,2,3,4].forEach(function(d){
  if(MF&&MF!==d)return;
  h2+='<li class="dh" style="--c:'+DC[d]+'"><span>'+DL[d]+'</span></li>';
  PTS.forEach(function(q){if(q.day===d)h2+=row(q)});
 });
 h2+='</ul>';
 document.getElementById('mapbox').innerHTML=h2;
 applyView();
}
(function(){
 var sec=document.getElementById('map'),P={},drag=null,pinch=null,moved=false;
 function svgEl(){return document.querySelector('#mapbox svg.map')}
 sec.addEventListener('click',function(e){
  var zb=e.target.closest('.zb');
  if(zb){var m=zb.getAttribute('data-z');if(m==='in')zoomBy(1.6);else if(m==='out')zoomBy(1/1.6);else{V.z=1;V.cx=MW/2;V.cy=MH/2;applyView()}return}
  if(moved)return;
  var c=e.target.closest('.chip');
  if(c){MF=+c.getAttribute('data-f');var cur=pById(MSEL);if(MF&&cur.day!==0&&cur.day!==MF){MSEL='h'}renderMap();return}
  var t=e.target.closest('.pt,.pl');
  if(t){MSEL=t.getAttribute('data-id');var list=t.classList.contains('pl');if(list&&V.z>1){var q=pById(MSEL);V.cx=q.x;V.cy=q.y}renderMap();if(list){sec.scrollIntoView({behavior:'smooth',block:'start'})}}
 });
 sec.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('pt')){e.preventDefault();MSEL=e.target.getAttribute('data-id');renderMap()}
 });
 sec.addEventListener('pointerdown',function(e){
  if(!e.target.closest('svg.map'))return;
  P[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(P);
  if(ids.length===1){drag={x:e.clientX,y:e.clientY,cx:V.cx,cy:V.cy};moved=false}
  else if(ids.length===2){var a=P[ids[0]],b=P[ids[1]];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:V.z};drag=null;moved=true}
 });
 sec.addEventListener('pointermove',function(e){
  if(!P[e.pointerId])return;P[e.pointerId]={x:e.clientX,y:e.clientY};
  var sv=svgEl(),ids=Object.keys(P);if(!sv)return;
  if(ids.length>=2&&pinch){var a=P[ids[0]],b=P[ids[1]],nz=Math.min(ZMAX,Math.max(1,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));if(Math.abs(nz-V.z)>0.01)zoomBy(nz/V.z);return}
  if(drag&&V.z>1.01){
   var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
   if(!moved&&Math.hypot(dx,dy)<5)return;
   moved=true;if(!sv.hasPointerCapture(e.pointerId))sv.setPointerCapture(e.pointerId);
   var u=(MW/V.z)/sv.getBoundingClientRect().width;V.cx=drag.cx-dx*u;V.cy=drag.cy-dy*u;applyView();
  }
 });
 function endP(e){
  delete P[e.pointerId];var ids=Object.keys(P);
  if(!ids.length){drag=null;pinch=null;setTimeout(function(){moved=false},0)}
  else if(ids.length===1){drag={x:P[ids[0]].x,y:P[ids[0]].y,cx:V.cx,cy:V.cy};pinch=null;moved=true}
 }
 sec.addEventListener('pointerup',endP);sec.addEventListener('pointercancel',endP);
 sec.addEventListener('wheel',function(e){
  var sv=e.target.closest&&e.target.closest('svg.map');if(!sv||!(e.ctrlKey||e.metaKey))return;
  e.preventDefault();var r=sv.getBoundingClientRect(),w=MW/V.z,h=MH/V.z;
  zoomBy(e.deltaY<0?1.2:1/1.2,V.cx-w/2+(e.clientX-r.left)/r.width*w,V.cy-h/2+(e.clientY-r.top)/r.height*h);
 },{passive:false});
 renderMap();
})();
</script>
