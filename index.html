.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
a{color:inherit}
h1,h2,h3,p{margin:0}

.top{background:transparent;text-shadow:0 1px 8px rgba(0,0,0,.55);color:var(--on-ink);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:28px max(16px,env(safe-area-inset-left,0px)) 24px}
.top-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.08em;opacity:.75}
h1{font-size:23px;line-height:1.3;font-weight:900;text-wrap:balance}
.range{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.range b{font:600 28px/1 var(--f-mono)}
.range span{opacity:.8;font-size:14px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid color-mix(in srgb,var(--on-ink) 35%,transparent)}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:transparent;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid transparent;transition:background .2s,border-color .2s}
nav.stuck{background:rgba(10,14,28,.72);border-bottom-color:var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
nav ul{list-style:none;margin:0 auto;padding:0;max-width:560px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav li{flex:1 0 auto}
nav a{display:block;text-align:center;text-decoration:none;font-size:13px;font-weight:700;padding:7px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
nav a i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c,var(--muted))}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:16px;font-weight:700}
.label{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-size:18px;font-weight:700;line-height:1.4}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;background:var(--fg);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--d2);outline-offset:2px}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:8px;padding:10px 12px;font-size:13px}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks li{padding-left:22px;position:relative}
.checks li::before{content:"";position:absolute;left:0;top:.45em;width:12px;height:12px;border:2px solid var(--muted);border-radius:3px}

.day{--c:var(--d1);display:flex;flex-direction:column;gap:14px;scroll-margin-top:64px}
.day-h{display:flex;align-items:center;gap:12px;padding:4px 2px;background:none;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.day-h .dn{font:600 30px/1 var(--f-mono);color:var(--c)}
.day-h .dt{display:flex;flex-direction:column;min-width:0}
.day-h .dt b{font-size:17px;line-height:1.3}
.day-h .dt span{font-size:12.5px;opacity:.9}
.route{margin-left:auto;font:600 12px/1 var(--f-mono);padding:5px 8px;border-radius:6px;background:rgba(0,0,0,.22);white-space:nowrap}

.line{list-style:none;margin:0;padding:0 0 0 0;position:relative;display:flex;flex-direction:column}
.line::before{content:"";position:absolute;left:66px;top:10px;bottom:10px;width:4px;border-radius:2px;background:var(--c)}
.stop{display:grid;grid-template-columns:52px 20px 1fr;column-gap:6px;padding:7px 0;align-items:start}
.time{font:500 13px/1.7 var(--f-mono);color:var(--muted);text-align:right}
.dot{position:relative;z-index:1;width:16px;height:16px;margin:5px 0 0 2px;border-radius:50%;background:var(--bg);border:4px solid var(--c)}
.stop.key .dot{background:var(--c)}
.body{min-width:0;display:flex;flex-direction:column;gap:3px}
.body b{font-weight:700;font-weight:500}
.stop.key .body .t{font-weight:700}
.sub{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--fg);margin-right:6px;vertical-align:1px}
.maps{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.maps a{font-size:12.5px;font-weight:500;text-decoration:none;padding:3px 10px;border-radius:99px;border:1px solid var(--c);color:var(--fg)}
.maps a::before{content:"📍 ";font-size:11px}

.foot{display:grid;grid-template-columns:1fr;gap:8px;font-size:13.5px;border-top:1px dashed var(--line);padding-top:12px}
.foot div{display:grid;grid-template-columns:44px 1fr;gap:8px}
.foot dt{color:var(--muted);font-weight:700}

.tel{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tel:first-of-type{border-top:0}
.tel small{display:block;color:var(--muted);font-size:12px}
.tel a{font:600 15px var(--f-mono);text-decoration:none;white-space:nowrap}
.copy{font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:6px 10px;min-height:36px}
small.end{color:var(--muted);text-align:center;font-size:12px}
